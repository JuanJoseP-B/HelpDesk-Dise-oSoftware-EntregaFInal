server:
  servlet:
    context-path: /api/v1

spring:
  datasource:
    url: jdbc:h2:mem:helpdesk_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        jdbc:
          batch_size: 20
  sql:
    init:
      mode: never
  mail:
    host: localhost
    port: 1025
    username:
    password:

app:
  jwt:
    secret: test-secret-test-secret-test-secret-test-secret
    expiration: 3600000
    refresh-expiration: 86400000
  cors:
    allowed-origins: http://localhost:3000
  notifications:
    queue-delay-ms: 600000
  sla:
    check-delay-ms: 600000

logging:
  level:
    com.helpdesk: INFO
    org.hibernate.SQL: WARN
    org.springframework.security: WARN
